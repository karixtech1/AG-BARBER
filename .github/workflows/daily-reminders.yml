name: Daily Barber Reminders
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check inactive customers and notify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OS_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          OS_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          node -e '
          const SUPABASE_URL = process.env.SUPABASE_URL.trim();
          const SUPABASE_KEY = process.env.SUPABASE_KEY.trim();
          const OS_APP_ID = process.env.OS_APP_ID.trim();
          const OS_API_KEY = process.env.OS_API_KEY.trim();
          const SITE_BASE = "https://karixtech1.github.io/FIDELIX";

          async function run() {
            const now = Date.now();

            const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?select=*,shops(slug,name,is_active,reminder_message,reminder_days)&last_visit_at=not.is.null`, {
              headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
            });
            const customers = await res.json();
            console.log("إجمالي الزبائن المفحوصين:", customers.length);

            for (const c of customers) {
              if (!c.shops?.is_active || !c.last_visit_at) continue;

              const reminderDays = Number(c.shops.reminder_days) || 28;
              const requiredMs = reminderDays * 24 * 60 * 60 * 1000;

              const sinceLastVisit = now - new Date(c.last_visit_at).getTime();
              if (sinceLastVisit < requiredMs) continue;

              if (c.last_notified_at) {
                const sinceLastNotify = now - new Date(c.last_notified_at).getTime();
                if (sinceLastNotify < requiredMs) continue;
              }

              const msgTemplate = c.shops.reminder_message || "شعرك طوال يا {name}، أرواح نفس الوقت تاع آخر مرة؟";
              const finalMsg = msgTemplate.replace(/\{name\}/g, c.full_name);
              const heading = `✂️ ${c.shops.name}`;
              const targetUrl = `${SITE_BASE}/index.html?shop=${encodeURIComponent(c.shops.slug)}&notif_title=${encodeURIComponent(heading)}&notif_msg=${encodeURIComponent(finalMsg)}`;

              const pushRes = await fetch("https://api.onesignal.com/notifications", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Key ${OS_API_KEY}`
                },
                body: JSON.stringify({
                  app_id: OS_APP_ID,
                  include_aliases: { external_id: [c.id] },
                  target_channel: "push",
                  headings: { en: heading },
                  contents: { en: finalMsg },
                  url: targetUrl
                })
              });
              const pushData = await pushRes.json();
              console.log(`نتيجة الإرسال لـ ${c.full_name} (بعد ${reminderDays} يوم):`, JSON.stringify(pushData));

              await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${c.id}`, {
                method: "PATCH",
                headers: {
                  "Content-Type": "application/json",
                  apikey: SUPABASE_KEY,
                  Authorization: `Bearer ${SUPABASE_KEY}`
                },
                body: JSON.stringify({ last_notified_at: new Date().toISOString() })
              });
            }
          }
          run().catch(err => { console.error(err); process.exit(1); });
          '
